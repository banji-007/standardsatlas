slug: 3ds-sdk
name: PCI 3DS SDK Security Standard
status: sunset-scheduled
source_url: https://www.pcisecuritystandards.org/standards/3dssdk
verified: false
last_verified: null
current_version: "1.1"
notes: >-
  Sunset period announced 01 May 2026. No new 3DS SDK submissions accepted after
  31 October 2026. SDKs including EMVCo 3DS SDKs are now eligible for assessment
  under PCI Secure Software Standard v2.0 (released Jan 2026). This sunset does
  not affect the PCI 3DS Core Standard. Source: PCI SSC Bulletin May 2026.
