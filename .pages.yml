content:

  # ── Standards (one YAML file per standard family) ─────────────────────────
  - name: standards
    label: Standards
    path: src/content/standards
    view:
      fields: [name, status, current_version, verified]
    fields:
      - { name: slug, label: Slug, type: string }
      - { name: name, label: Name, type: string }
      - name: status
        label: Status
        type: select
        options:
          - { value: active, label: Active }
          - { value: under-review, label: Under Review }
          - { value: sunset-scheduled, label: Sunset Scheduled }
          - { value: retired, label: Retired }
          - { value: forthcoming, label: Forthcoming }
      - { name: source_url, label: Source URL, type: string }
      - { name: verified, label: Verified, type: boolean }
      - { name: last_verified, label: Last Verified, type: date }
      - { name: current_version, label: Current Version, type: string }
      - { name: notes, label: Notes, type: text }
      - name: versions
        label: Versions
        type: object
        list: true
        fields:
          - { name: version, label: Version, type: string }
          - { name: published, label: Published, type: date }
          - { name: retired, label: Retired, type: date }
          - name: status
            label: Status
            type: select
            options:
              - { value: active, label: Active }
              - { value: sunset-scheduled, label: Sunset Scheduled }
              - { value: retired, label: Retired }
          - { name: source_url, label: Source URL, type: string }
          - { name: verified, label: Verified, type: boolean }
      - name: documents
        label: Documents
        type: object
        list: true
        fields:
          - { name: slug, label: Slug, type: string }
          - { name: title, label: Title, type: string }
          - name: type
            label: Type
            type: select
            options:
              - { value: standard, label: Standard }
              - { value: guidance, label: Guidance }
              - { value: faq, label: FAQ }
              - { value: template, label: Template }
              - { value: saq, label: SAQ }
              - { value: report, label: Report }
              - { value: bulletin, label: Bulletin }
              - { value: supplemental, label: Supplemental }
              - { value: program-guide, label: Program Guide }
          - { name: published, label: Published, type: date }
          - { name: applies_to_version, label: Applies to Version, type: string }
          - { name: source_url, label: Source URL, type: string }
          - { name: verified, label: Verified, type: boolean }

  # ── Relationships (single file) ────────────────────────────────────────────
  - name: relationships
    label: Relationships
    path: data/relationships.yaml
    fields:
      - name: relationships
        label: Relationship Edges
        type: object
        list: true
        fields:
          - { name: id, label: ID, type: string }
          - name: type
            label: Type
            type: select
            options:
              - { value: associate, label: Associate }
              - { value: supersede, label: Supersede }
              - { value: converge, label: Converge }
          - { name: from, label: "From (standard slug)", type: string }
          - { name: to, label: "To (standard slug)", type: string }
          - name: state
            label: State
            type: select
            options:
              - { value: planned, label: Planned }
              - { value: in-progress, label: In Progress }
              - { value: complete, label: Complete }
          - { name: effective_date, label: Effective Date, type: date }
          - { name: description, label: Description, type: text }
          - { name: source_url, label: Source URL, type: string }
          - { name: verified, label: Verified, type: boolean }

  # ── External Bodies (single file) ─────────────────────────────────────────
  - name: external_bodies
    label: External Bodies
    path: data/external-bodies.yaml
    fields:
      - name: external_bodies
        label: Bodies
        type: object
        list: true
        fields:
          - { name: slug, label: Slug, type: string }
          - { name: name, label: Name, type: string }
          - { name: url, label: URL, type: string }
          - { name: verified, label: Verified, type: boolean }
